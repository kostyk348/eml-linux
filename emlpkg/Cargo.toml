[package]
name = "emlpkg"
version = "0.1.0"
edition = "2021"
description = "emlpkg — packages are single .eml containers; transactional install/rollback via the hash-chained log"

[dependencies]
emlcore = { path = "../emlcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
